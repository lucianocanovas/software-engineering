<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Gestión de Categorías')}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{layout/fragments :: sidebar('categorias')}"></div>

    <div class="main-wrapper">
        <header th:replace="~{layout/fragments :: topbar('Categorías de Catálogo', 'Relación de Agregación UML: Categoría 1 agrupa 0..* Productos')}"></header>

        <main class="content-body">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="fw-bold mb-0 text-dark">Categorías Registradas</h5>
                    <small class="text-muted">Las categorías agrupan productos tecnológicos sin adueñarse de su ciclo de vida.</small>
                </div>
                <a th:href="@{/categorias/nueva}" class="btn btn-primary">
                    <i class="bi bi-folder-plus me-1"></i> + Nueva Categoría
                </a>
            </div>

            <div class="card card-custom">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-custom table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Código</th>
                                    <th>Nombre de Categoría</th>
                                    <th>Descripción</th>
                                    <th>Productos Agrupados</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${categorias}">
                                    <td><code class="fw-bold text-primary" th:text="${c.codigo}">CAT-001</code></td>
                                    <td class="fw-semibold text-dark" th:text="${c.nombre}">Nombre</td>
                                    <td class="text-muted small" th:text="${c.descripcion}">Descripción</td>
                                    <td>
                                        <a th:href="@{/productos(categoriaId=${c.id})}" class="badge bg-light text-primary border text-decoration-none">
                                            <i class="bi bi-box me-1"></i> <span th:text="${c.cantidadProductos}">0</span> productos
                                        </a>
                                    </td>
                                    <td class="text-end">
                                        <div class="btn-group btn-group-sm">
                                            <a th:href="@{/categorias/editar/{id}(id=${c.id})}" class="btn btn-outline-primary" title="Editar">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/categorias/eliminar/{id}(id=${c.id})}" method="post" class="d-inline"
                                                  onsubmit="return confirm('¿Desea eliminar esta categoría?');">
                                                <button type="submit" class="btn btn-outline-danger" title="Eliminar">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${categorias.isEmpty()}">
                                    <td colspan="5" class="text-center py-4 text-muted">
                                        No hay categorías registradas.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
