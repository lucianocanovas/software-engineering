# ==============================================================================
# CONFIGURACIÓN DE LA APLICACIÓN Y ARQUITECTURA MVC CON SPRING BOOT
# ==============================================================================

# Nombre del microservicio / aplicación
spring.application.name=techstore-mvc
server.port=8080

# ==============================================================================
# CONFIGURACIÓN DEL ORM Y BASE DE DATOS SQLITE
# ==============================================================================
# SQLite es un motor de base de datos relacional embebido y ligero que persiste
# los datos directamente en un archivo local sin requerir un servidor dedicado.
spring.datasource.url=jdbc:sqlite:./techstore.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Estrategia de generación DDL de Hibernate:
# 'update' compara el esquema de la base de datos con las entidades JPA anotadas
# con @Entity y crea o modifica las tablas automáticamente al iniciar la app.
spring.jpa.hibernate.ddl-auto=update

# Dialecto Hibernate específico para SQLite provisto por hibernate-community-dialects
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Muestra las sentencias SQL generadas por el ORM en la consola de depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar Open-Session-In-View para promover buenas prácticas de desacoplamiento
# forzando que la obtención y transformación de entidades a DTOs ocurra en la capa Service
spring.jpa.open-in-view=false

# ==============================================================================
# CONFIGURACIÓN DE THYMELEAF (MOTOR DE VISTAS)
# ==============================================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

