<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${tituloForm})}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{layout/fragments :: sidebar('proveedores')}"></div>

    <div class="main-wrapper">
        <header th:replace="~{layout/fragments :: topbar(${tituloForm}, 'Administración de distribuidores y mayoristas tecnológicos')}"></header>

        <main class="content-body">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8">
                    <div class="card card-custom">
                        <div class="card-header bg-white border-bottom py-3">
                            <h6 class="mb-0 fw-bold text-dark">
                                <i class="bi bi-building me-2 text-primary"></i>Datos del Proveedor Mayorista
                            </h6>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">

                                <div class="row g-3 mb-3">
                                    <div class="col-md-4">
                                        <label for="codigo" class="form-label fw-semibold">Código de Proveedor *</label>
                                        <input type="text" id="codigo" th:field="*{codigo}" class="form-control"
                                               th:classappend="${#fields.hasErrors('codigo') ? 'is-invalid' : ''}"
                                               placeholder="Ej: PRV-005" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                    </div>

                                    <div class="col-md-8">
                                        <label for="razonSocial" class="form-label fw-semibold">Razón Social *</label>
                                        <input type="text" id="razonSocial" th:field="*{razonSocial}" class="form-control"
                                               th:classappend="${#fields.hasErrors('razonSocial') ? 'is-invalid' : ''}"
                                               placeholder="Ej: Corsair Distribuidora Oficial" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="cuit" class="form-label fw-semibold">CUIT / Identificación Fiscal *</label>
                                        <input type="text" id="cuit" th:field="*{cuit}" class="form-control"
                                               th:classappend="${#fields.hasErrors('cuit') ? 'is-invalid' : ''}"
                                               placeholder="30-XXXXXXXX-X" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cuit')}" th:errors="*{cuit}"></div>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="telefono" class="form-label fw-semibold">Teléfono de Contacto</label>
                                        <input type="tel" id="telefono" th:field="*{telefono}" class="form-control"
                                               placeholder="+54 11 0000-0000">
                                    </div>

                                    <div class="col-md-4">
                                        <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                                        <input type="email" id="email" th:field="*{email}" class="form-control"
                                               placeholder="ventas@mayorista.com">
                                    </div>

                                    <div class="col-12">
                                        <label for="direccion" class="form-label fw-semibold">Dirección Comercial / Depósito</label>
                                        <input type="text" id="direccion" th:field="*{direccion}" class="form-control"
                                               placeholder="Calle, número, localidad y provincia">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/proveedores}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                                        <i class="bi bi-save me-1"></i> Guardar Proveedor
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
