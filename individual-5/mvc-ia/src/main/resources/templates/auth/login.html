<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head('Iniciar Sesión')}"></head>
<body class="bg-dark d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%) !important;">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Cabecera de la tarjeta con estilo tecnológico -->
                <div class="card-header bg-primary text-white text-center py-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-25 rounded-circle p-3 mb-2">
                        <i class="bi bi-cpu-fill fs-1 text-white"></i>
                    </div>
                    <h3 class="fw-bold mb-1">TechStore MVC</h3>
                    <p class="mb-0 text-white-50 small">Sistema de Venta de Tecnología y Control de Stock</p>
                </div>

                <div class="card-body p-4 p-md-5 bg-white">
                    <!-- Inclusión de alertas flash -->
                    <div th:replace="~{layout/fragments :: alerts}"></div>

                    <div th:if="${errorLogin != null}" class="alert alert-danger d-flex align-items-center gap-2 small py-2">
                        <i class="bi bi-x-circle-fill"></i>
                        <span th:text="${errorLogin}">Credenciales incorrectas</span>
                    </div>

                    <form th:action="@{/login}" th:object="${loginDTO}" method="post" novalidate>
                        <!-- Campo: Nombre de Usuario -->
                        <div class="mb-3">
                            <label for="nombreUsuario" class="form-label fw-semibold text-secondary">
                                <i class="bi bi-person me-1"></i> Usuario
                            </label>
                            <input type="text"
                                   id="nombreUsuario"
                                   th:field="*{nombreUsuario}"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('nombreUsuario') ? 'is-invalid' : ''}"
                                   placeholder="Ej: admin, compras o vendedor"
                                   required autofocus>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nombreUsuario')}" th:errors="*{nombreUsuario}">
                                Error de usuario
                            </div>
                        </div>

                        <!-- Campo: Contraseña -->
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">
                                <i class="bi bi-lock me-1"></i> Contraseña
                            </label>
                            <input type="password"
                                   id="password"
                                   th:field="*{password}"
                                   class="form-control form-control-lg"
                                   th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                   placeholder="••••••••"
                                   required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">
                                Error de contraseña
                            </div>
                        </div>

                        <!-- Botón Submit -->
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema
                            </button>
                        </div>
                    </form>

                    <!-- Acceso Rápido / Credenciales de Prueba -->
                    <div class="p-3 bg-light rounded-3 border">
                        <div class="small fw-bold text-muted text-uppercase mb-2 text-center">
                            <i class="bi bi-key-fill text-warning me-1"></i> Credenciales de Acceso Rápido
                        </div>
                        <div class="d-flex flex-column gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center"
                                    onclick="llenarCredenciales('admin', 'admin123')">
                                <span><i class="bi bi-shield-lock me-1"></i> <strong>Administrador</strong></span>
                                <span class="badge bg-primary">admin / admin123</span>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-info text-dark text-start d-flex justify-content-between align-items-center"
                                    onclick="llenarCredenciales('compras', 'compras123')">
                                <span><i class="bi bi-cart-check me-1"></i> <strong>Encargado de Compras</strong></span>
                                <span class="badge bg-info text-dark">compras / compras123</span>
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary text-start d-flex justify-content-between align-items-center"
                                    onclick="llenarCredenciales('vendedor', 'vendedor123')">
                                <span><i class="bi bi-tag me-1"></i> <strong>Vendedor Comercial</strong></span>
                                <span class="badge bg-secondary">vendedor / vendedor123</span>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="card-footer bg-light text-center py-3 border-0 small text-muted">
                    Arquitectura MVC &bull; Thymeleaf &bull; SQLite ORM &bull; Capa DTO
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function llenarCredenciales(usuario, clave) {
        document.getElementById('nombreUsuario').value = usuario;
        document.getElementById('password').value = clave;
    }
</script>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
