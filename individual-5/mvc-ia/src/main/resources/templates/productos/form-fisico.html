<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${tituloForm})}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{layout/fragments :: sidebar('productos')}"></div>

    <div class="main-wrapper">
        <header th:replace="~{layout/fragments :: topbar(${tituloForm}, 'Herencia UML: Especialización ProductoFisico (Hardware con Stock y Depósito)')}"></header>

        <main class="content-body">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-xl-9">
                    <div class="card card-custom shadow-sm">
                        <div class="card-header bg-white border-bottom py-3 d-flex align-items-center justify-content-between">
                            <h6 class="mb-0 fw-bold text-dark">
                                <i class="bi bi-box-seam text-primary me-2"></i>Datos del Dispositivo Físico (Hardware)
                            </h6>
                            <span class="badge bg-primary">Especialización ProductoFisico</span>
                        </div>

                        <div class="card-body p-4">
                            <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">
                                <input type="hidden" th:field="*{tipoProducto}" value="FISICO">

                                <!-- SECCIÓN 1: ATRIBUTOS DE LA CLASE BASE (Producto) -->
                                <h6 class="text-uppercase text-secondary small fw-bold mb-3 border-bottom pb-2">
                                    <i class="bi bi-layers me-1"></i> 1. Atributos Generales (Clase Base Producto)
                                </h6>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-4">
                                        <label for="codigo" class="form-label fw-semibold">Código de Producto *</label>
                                        <input type="text" id="codigo" th:field="*{codigo}" class="form-control"
                                               th:classappend="${#fields.hasErrors('codigo') ? 'is-invalid' : ''}"
                                               placeholder="Ej: PROD-HW-001" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                    </div>

                                    <div class="col-md-8">
                                        <label for="nombre" class="form-label fw-semibold">Nombre Comercial *</label>
                                        <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                               th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}"
                                               placeholder="Ej: Placa de Video NVIDIA RTX 4070 12GB" required>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="categoriaId" class="form-label fw-semibold">Categoría (Agregación UML) *</label>
                                        <select id="categoriaId" th:field="*{categoriaId}" class="form-select"
                                                th:classappend="${#fields.hasErrors('categoriaId') ? 'is-invalid' : ''}" required>
                                            <option value="">-- Seleccione una Categoría --</option>
                                            <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nombre}"></option>
                                        </select>
                                        <div class="invalid-feedback" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="precioVenta" class="form-label fw-semibold">Precio de Venta Base ($) *</label>
                                        <div class="input-group">
                                            <span class="input-group-text">$</span>
                                            <input type="number" step="0.01" min="0.01" id="precioVenta" th:field="*{precioVenta}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('precioVenta') ? 'is-invalid' : ''}" required>
                                        </div>
                                        <small class="text-muted">El precio final adiciona 3% de seguro de embalaje y logística.</small>
                                        <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></div>
                                    </div>

                                    <div class="col-12">
                                        <label for="descripcion" class="form-label fw-semibold">Descripción Técnica</label>
                                        <textarea id="descripcion" th:field="*{descripcion}" rows="2" class="form-control"
                                                  placeholder="Especificaciones técnicas, puertos, compatibilidad..."></textarea>
                                    </div>
                                </div>

                                <!-- SECCIÓN 2: ATRIBUTOS ESPECÍFICOS DE LA SUBCLASE (ProductoFisico) -->
                                <h6 class="text-uppercase text-secondary small fw-bold mb-3 border-bottom pb-2">
                                    <i class="bi bi-box me-1"></i> 2. Atributos Específicos de Almacenamiento e Inventario Físico
                                </h6>

                                <div class="row g-3 mb-4">
                                    <div class="col-md-3">
                                        <label for="stock" class="form-label fw-semibold">Stock Inicial en Bodega</label>
                                        <input type="number" min="0" id="stock" th:field="*{stock}" class="form-control"
                                               th:classappend="${#fields.hasErrors('stock') ? 'is-invalid' : ''}">
                                        <small class="text-muted">Se incrementa con Órdenes de Compra.</small>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="stockMinimo" class="form-label fw-semibold">Stock Mínimo de Alerta</label>
                                        <input type="number" min="0" id="stockMinimo" th:field="*{stockMinimo}" class="form-control"
                                               th:classappend="${#fields.hasErrors('stockMinimo') ? 'is-invalid' : ''}">
                                    </div>

                                    <div class="col-md-3">
                                        <label for="peso" class="form-label fw-semibold">Peso Estimado (kg)</label>
                                        <div class="input-group">
                                            <input type="number" step="0.01" min="0" id="peso" th:field="*{peso}" class="form-control">
                                            <span class="input-group-text">kg</span>
                                        </div>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="ubicacionDeposito" class="form-label fw-semibold">Ubicación Depósito</label>
                                        <input type="text" id="ubicacionDeposito" th:field="*{ubicacionDeposito}" class="form-control"
                                               placeholder="Ej: Pasillo A-04">
                                    </div>
                                </div>

                                <!-- BOTONES DE ACCIÓN -->
                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                                        <i class="bi bi-save me-1"></i> Guardar Producto Físico
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
