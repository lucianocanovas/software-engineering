<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/fragments :: head(${tituloForm})}"></head>
<body>

<div class="d-flex">
    <div th:replace="~{layout/fragments :: sidebar('categorias')}"></div>

    <div class="main-wrapper">
        <header th:replace="~{layout/fragments :: topbar(${tituloForm}, 'Administración de agrupación de productos tecnológicos')}"></header>

        <main class="content-body">
            <div th:replace="~{layout/fragments :: alerts}"></div>

            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card card-custom">
                        <div class="card-header bg-white border-bottom py-3">
                            <h6 class="mb-0 fw-bold text-dark">
                                <i class="bi bi-folder me-2 text-primary"></i>Datos de la Categoría
                            </h6>
                        </div>
                        <div class="card-body p-4">
                            <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" novalidate>
                                <input type="hidden" th:field="*{id}">

                                <div class="mb-3">
                                    <label for="codigo" class="form-label fw-semibold">Código *</label>
                                    <input type="text" id="codigo" th:field="*{codigo}" class="form-control"
                                           th:classappend="${#fields.hasErrors('codigo') ? 'is-invalid' : ''}"
                                           placeholder="Ej: CAT-HW" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                                </div>

                                <div class="mb-3">
                                    <label for="nombre" class="form-label fw-semibold">Nombre de Categoría *</label>
                                    <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                           th:classappend="${#fields.hasErrors('nombre') ? 'is-invalid' : ''}"
                                           placeholder="Ej: Monitores y Pantallas" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <div class="mb-4">
                                    <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                    <textarea id="descripcion" th:field="*{descripcion}" rows="3" class="form-control"
                                              placeholder="Descripción del tipo de dispositivos agrupados..."></textarea>
                                </div>

                                <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                    <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                                    <button type="submit" class="btn btn-primary px-4 fw-bold">
                                        <i class="bi bi-save me-1"></i> Guardar Categoría
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{layout/fragments :: footer}"></footer>
    </div>
</div>

<div th:replace="~{layout/fragments :: scripts}"></div>
</body>
</html>
