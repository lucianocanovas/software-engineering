# ===================================================================
# CONFIGURACIÓN GENERAL DEL SISTEMA DE GESTIÓN ESCOLAR (MVC + IA)
# ===================================================================
server.port=8080
spring.application.name=colegio-mvc

# ===================================================================
# PERSISTENCIA ORM: BASE DE DATOS EMBEBIDA SQLITE3
# ===================================================================
# Archivo de base de datos relacional persistente colegio.db
spring.datasource.url=jdbc:sqlite:colegio.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Estrategia DDL de Hibernate: Actualizar automáticamente el esquema de tablas según las entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# MOTOR DE PLANTILLAS THYMELEAF
# ===================================================================
# Desactivar caché en modo desarrollo para recarga inmediata de vistas HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===================================================================
# SERVICIO DE CORREO ELECTRÓNICO (JavaMailSender)
# ===================================================================
# Configuración SMTP estándar (se gestiona con tolerancia a fallos en EmailService para ejecuciones locales/offline)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notificaciones.colegio@educacion.edu.ar
spring.mail.password=mockPassword123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=3000

# ===================================================================
# LOGGING Y TRAZABILIDAD
# ===================================================================
logging.level.com.colegio=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
