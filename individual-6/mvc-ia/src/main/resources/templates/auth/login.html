<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión • Sistema Escolar MVC</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="auth-wrapper">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card auth-card p-4 p-md-5">
                    <!-- Cabecera institucional -->
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="bi bi-mortarboard-fill fs-1"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Colegio San Martín</h3>
                        <p class="text-muted small">Ingreso al Sistema de Gestión Escolar</p>
                    </div>

                    <!-- Notificaciones de error o confirmación -->
                    <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                        <i class="bi bi-exclamation-octagon-fill me-1"></i>
                        <span th:text="${errorMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${logoutMsg}" class="alert alert-info alert-dismissible fade show small" role="alert">
                        <i class="bi bi-info-circle-fill me-1"></i>
                        <span th:text="${logoutMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show small" role="alert">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="${successMsg}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <!-- Formulario de Login -->
                    <form th:action="@{/login}" method="post">
                        <!-- El usuario es el correo personal del docente -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-secondary small">
                                <i class="bi bi-envelope-fill me-1"></i> Correo Personal (Usuario)
                            </label>
                            <input type="email" id="email" name="email" class="form-control form-control-lg fs-6"
                                   placeholder="ejemplo@colegio.edu.ar" required autofocus>
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between">
                                <label for="password" class="form-label fw-semibold text-secondary small">
                                    <i class="bi bi-lock-fill me-1"></i> Contraseña
                                </label>
                            </div>
                            <input type="password" id="password" name="password" class="form-control form-control-lg fs-6"
                                   placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar a la Plataforma
                        </button>
                    </form>

                    <!-- Acceso al Registro de Docentes -->
                    <div class="text-center pt-3 border-top">
                        <span class="text-muted small">¿Es nuevo docente en la institución?</span><br>
                        <a th:href="@{/registro}" class="text-decoration-none fw-semibold">
                            <i class="bi bi-person-plus-fill me-1"></i> Registrarse como Docente
                        </a>
                    </div>

                    <!-- Credenciales Demo de Prueba -->
                    <div class="mt-4 p-3 bg-light rounded-3 border small">
                        <div class="fw-bold text-secondary mb-1">
                            <i class="bi bi-key-fill text-warning me-1"></i> Cuenta Docente Demo:
                        </div>
                        <div class="text-muted font-monospace">
                            Usuario: <strong>profesor.demo@colegio.edu.ar</strong><br>
                            Clave: <strong>password123</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
