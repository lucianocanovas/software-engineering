<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, 'perfil', ~{::content})}">
<head>
    <title>Seguridad • Cambiar Contraseña</title>
</head>
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <h3 class="fw-bold mb-1">Seguridad de la Cuenta</h3>
            <p class="text-muted mb-0">Gestión y cambio seguro de contraseña para el usuario docente.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card content-card p-4">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-warning bg-opacity-10 text-warning mb-2">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h5 class="fw-bold text-dark">Modificar Contraseña</h5>
                        <p class="text-muted small">Por motivos de seguridad, debe ingresar su contraseña actual antes de establecer la nueva clave.</p>
                    </div>

                    <form th:action="@{/perfil/cambiar-password}" th:object="${cambioPassword}" method="post">
                        <!-- Contraseña Actual -->
                        <div class="mb-3">
                            <label for="passwordActual" class="form-label fw-semibold small">
                                Contraseña Actual <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="passwordActual" th:field="*{passwordActual}"
                                       placeholder="Ingrese su clave actual" required autofocus>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('passwordActual')}" th:errors="*{passwordActual}"></div>
                        </div>

                        <!-- Nueva Contraseña -->
                        <div class="mb-3">
                            <label for="nuevoPassword" class="form-label fw-semibold small">
                                Nueva Contraseña <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="nuevoPassword" th:field="*{nuevoPassword}"
                                       placeholder="Mínimo 6 caracteres" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('nuevoPassword')}" th:errors="*{nuevoPassword}"></div>
                        </div>

                        <!-- Confirmar Nueva Contraseña -->
                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold small">
                                Confirmar Nueva Contraseña <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                                       placeholder="Repita la nueva clave" required>
                            </div>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                        </div>

                        <button type="submit" class="btn btn-warning btn-lg w-100 fw-semibold text-dark shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Actualizar Contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
