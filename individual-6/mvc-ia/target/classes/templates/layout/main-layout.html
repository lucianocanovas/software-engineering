<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, activeTab, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Sistema de Gestión Escolar MVC</title>

    <!-- Bootstrap 5 CSS (ThemeWagon Standard) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos Custom ThemeWagon -->
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body>
    <div class="d-flex">
        <!-- Barra Lateral (Sidebar) -->
        <div th:replace="~{fragments/sidebar :: sidebarFragment(${activeTab})}"></div>

        <!-- Contenido Principal -->
        <div class="flex-grow-1 d-flex flex-column min-vh-100">
            <!-- Barra Superior (Navbar) -->
            <div th:replace="~{fragments/navbar :: navbarFragment}"></div>

            <!-- Área de Vista Dinámica -->
            <main class="flex-grow-1 p-4">
                <!-- Notificaciones globales -->
                <div th:replace="~{fragments/alerts :: alertsFragment}"></div>

                <!-- Bloque inyectado -->
                <div th:replace="${content}"></div>
            </main>

            <!-- Pie de Página -->
            <footer class="bg-white border-top py-3 px-4 text-center text-muted" style="font-size: 0.85rem;">
                <div class="container-fluid d-flex flex-column flex-md-row justify-content-between align-items-center">
                    <span>&copy; 2026 Colegio Nacional San Martín - Arquitectura MVC con Spring Boot y SQLite3</span>
                    <span>Ingeniería de Software • Ejercicio "a" con IA</span>
                </div>
            </footer>
        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
