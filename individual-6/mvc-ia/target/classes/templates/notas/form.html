<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::title}, 'notas', ~{::content})}">
<head>
    <title>Asentar Calificación • Sistema Escolar</title>
</head>
<body>
    <div th:fragment="content">
        <div class="mb-4">
            <a th:href="@{/notas}" class="btn btn-sm btn-outline-secondary mb-2">
                <i class="bi bi-arrow-left me-1"></i> Volver a Calificaciones
            </a>
            <h3 class="fw-bold mb-1">Asentar Calificación de Alumno</h3>
            <p class="text-muted mb-0">Seleccione la instancia evaluativa y asigne el puntaje alcanzado por el estudiante.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-lg-7">
                <div class="card content-card p-4">
                    <form th:action="@{/notas/guardar}" th:object="${nota}" method="post">
                        <div class="row g-3">
                            <!-- Evaluación -->
                            <div class="col-12">
                                <label for="evaluacionId" class="form-label fw-semibold small">Instancia de Evaluación (Composición) <span class="text-danger">*</span></label>
                                <select class="form-select" id="evaluacionId" th:field="*{evaluacionId}" required>
                                    <option value="" disabled selected>Seleccione la evaluación...</option>
                                    <option th:each="e : ${evaluaciones}" th:value="${e.id}"
                                            th:text="${e.titulo} + ' (' + ${e.materiaNombre} + ' - ' + ${e.tipo} + ')'"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('evaluacionId')}" th:errors="*{evaluacionId}"></div>
                            </div>

                            <!-- Alumno -->
                            <div class="col-12">
                                <label for="alumnoId" class="form-label fw-semibold small">Alumno a Calificar (Asociación) <span class="text-danger">*</span></label>
                                <select class="form-select" id="alumnoId" th:field="*{alumnoId}" required>
                                    <option value="" disabled selected>Seleccione el estudiante...</option>
                                    <option th:each="alu : ${alumnos}" th:value="${alu.id}"
                                            th:text="${alu.nombreCompleto} + ' (Matrícula: ' + ${alu.codigo} + ' - ' + ${alu.aulaNombre} + ')'"></option>
                                </select>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('alumnoId')}" th:errors="*{alumnoId}"></div>
                            </div>

                            <!-- Puntaje -->
                            <div class="col-md-6">
                                <label for="puntaje" class="form-label fw-semibold small">Puntaje / Nota (0.0 a 10.0) <span class="text-danger">*</span></label>
                                <input type="number" step="0.1" min="0" max="10" class="form-control" id="puntaje" th:field="*{puntaje}" placeholder="Ej: 8.5" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('puntaje')}" th:errors="*{puntaje}"></div>
                            </div>

                            <!-- Fecha -->
                            <div class="col-md-6">
                                <label for="fecha" class="form-label fw-semibold small">Fecha de Calificación <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="fecha" th:field="*{fecha}" required>
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fecha')}" th:errors="*{fecha}"></div>
                            </div>

                            <!-- Observaciones -->
                            <div class="col-12">
                                <label for="observaciones" class="form-label fw-semibold small">Observaciones o Devolución Pedagógica</label>
                                <textarea class="form-control" id="observaciones" th:field="*{observaciones}" rows="3" placeholder="Comentarios sobre el examen o aspectos a reforzar..."></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a th:href="@{/notas}" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2 me-1"></i> Asentar Nota
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
