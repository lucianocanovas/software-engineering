# =========================================================================================
# PERFIL DE PRODUCCIÓN / BASE DE DATOS MYSQL (spring.profiles.active=mysql)
# =========================================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/club_deportivo_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

