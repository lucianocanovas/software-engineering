# =========================================================================================
# CONFIGURACIÓN DE LA APLICACIÓN - CLUB DEPORTIVO MVC
# =========================================================================================

spring.application.name=club-deportivo-mvc
server.port=8080

# -----------------------------------------------------------------------------------------
# CONFIGURACIÓN ORM / JPA / HIBERNATE
# -----------------------------------------------------------------------------------------
# Modo de desarrollo / pruebas: H2 en compatibilidad MySQL
spring.datasource.url=jdbc:h2:mem:club_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Habilitar consola H2 web para inspección en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------------------
# MOTOR DE PLANTILLAS THYMELEAF
# -----------------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# -----------------------------------------------------------------------------------------
# GESTIÓN DE ARCHIVOS MULTIMEDIA / FOTOGRAFÍAS DE ROSTRO
# -----------------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# -----------------------------------------------------------------------------------------
# LOGGING Y TRAZABILIDAD
# -----------------------------------------------------------------------------------------
logging.level.com.clubdeportivo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

