<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso al Sistema | Club Deportivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background-color: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 2.25rem 2rem;
            text-align: center;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <i class="bi bi-shield-shaded display-4 mb-2"></i>
        <h3 class="fw-bold mb-0">Club Deportivo</h3>
        <p class="text-white-50 small mb-0">Sistema Integral de Gestión & Molinetes con IA</p>
    </div>

    <div class="p-4 p-md-4">
        <!-- Alertas de Error o Logout -->
        <div th:if="${errorMessage}" class="alert alert-danger py-2 small d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${errorMessage}">Error de credenciales</span>
        </div>
        <div th:if="${logoutMessage}" class="alert alert-info py-2 small d-flex align-items-center gap-2" role="alert">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="${logoutMessage}">Sesión cerrada</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="admin, operador, socio" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label small fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </button>
        </form>

        <!-- Credenciales Rápidas para Demostración -->
        <div class="mt-4 pt-3 border-top">
            <div class="small fw-semibold text-muted text-center mb-2">Credenciales de Acceso Rápido:</div>
            <div class="d-flex flex-column gap-1">
                <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('admin', 'admin123')">
                    <strong>Admin:</strong> <code>admin</code> / <code>admin123</code> <span class="badge bg-primary float-end">Total</span>
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('operador', 'operador123')">
                    <strong>Operador:</strong> <code>operador</code> / <code>operador123</code> <span class="badge bg-info float-end">Molinete</span>
                </button>
                <button type="button" class="btn btn-outline-secondary btn-sm text-start" onclick="fillCreds('socio', 'socio123')">
                    <strong>Socio:</strong> <code>socio</code> / <code>socio123</code> <span class="badge bg-secondary float-end">Consulta</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('username').value = u;
        document.getElementById('password').value = p;
    }
</script>
</body>
</html>
