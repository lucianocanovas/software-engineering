spring.application.name=ferreteria-mvc
server.port=8080

# SQLite mantiene la base en un archivo local, sin instalar un servidor externo.
# El archivo se crea junto al proyecto y no requiere una carpeta previa.
spring.datasource.url=jdbc:sqlite:individual-4\ai-mvc\demo\ferreteria.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Thymeleaf recarga las plantillas durante el desarrollo.
spring.thymeleaf.cache=false